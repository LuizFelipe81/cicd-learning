name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Executar Flake8 (Linter)
        run: |
          cd backend
          flake8 .

      - name: Executar Testes do Backend
        run: |
          cd backend
          python manage.py test

  frontend-checks:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências
        run: |
          cd frontend
          npm ci

      - name: Executar ESLint
        run: |
          cd frontend
          npm run lint

      - name: Executar Testes do Frontend
        run: |
          cd frontend
          npm test -- --passWithNoTests

  docker-build-test:
    name: Teste de Build do Docker
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Validar Build dos Contêineres de Produção
        run: |
          docker compose -f docker-compose-prod.yml build
          